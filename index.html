function doPost(e) {
  // Without this lock, two teachers saving within moments of each other can both
  // calculate the same "next empty row" before either has written anything, and
  // the second write silently overwrites the first's rows instead of appending
  // after them. The lock forces concurrent saves to queue one at a time.
  var lock = LockService.getScriptLock();
  lock.waitLock(30000);
  try {
    var type = e.parameter.type || 'students';
    var raw = e.parameter.data || '[]';
    var payload = JSON.parse(raw);
    if (type === 'students') {
      writeStudents_(payload);
    } else if (type === 'attendance') {
      appendMonthlyRecords_('Attendance', ['date', 'class', 'name', 'present', 'studentId'], e.parameter.date, payload, function (r) { return [r.className, r.name, r.present, r.studentId]; });
    } else if (type === 'meals') {
      appendMonthlyRecords_('Meals', ['date', 'class', 'name', 'served', 'studentId'], e.parameter.date, payload, function (r) { return [r.className, r.name, r.served, r.studentId]; });
    }
  } finally {
    lock.releaseLock();
  }
  return ContentService.createTextOutput(JSON.stringify({ ok: true })).setMimeType(ContentService.MimeType.JSON);
}

function normalizeDate_(val) {
  if (Object.prototype.toString.call(val) === '[object Date]') {
    var tz = SpreadsheetApp.getActiveSpreadsheet().getSpreadsheetTimeZone();
    return Utilities.formatDate(val, tz, 'yyyy-MM-dd');
  }
  return String(val);
}

var HEADER_ALIASES_ = { id: 'id', name: 'name', classname: 'className', class: 'className', rmt: 'rmt' };

function readSheetAsObjects_(name) {
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var sheet = ss.getSheetByName(name);
  if (!sheet) return [];
  var values = sheet.getDataRange().getValues();
  if (values.length === 0) return [];
  var headers = values.shift();
  return values.filter(function (r) { return r[0] !== ''; }).map(function (row) {
    var obj = {};
    headers.forEach(function (h, i) {
      var raw = String(h).trim();
      var key = HEADER_ALIASES_[raw.toLowerCase()] || raw;
      var val = row[i];
      obj[key] = key === 'date' ? normalizeDate_(val) : val;
    });
    return obj;
  });
}

function writeStudents_(students) {
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var sheet = ss.getSheetByName('Students') || ss.insertSheet('Students');
  var headers = ['id', 'name', 'className', 'rmt'];
  var rows = students.map(function (s) { return [s.id, s.name, s.className, s.rmt]; });
  sheet.clear();
  sheet.getRange(1, 1, 1, headers.length).setValues([headers]);
  if (rows.length > 0) sheet.getRange(2, 1, rows.length, headers.length).setValues(rows);
}

// ---------- month-partitioned attendance/meals storage ----------
// Instead of one sheet that grows forever, each month gets its own sheet
// (e.g. "Attendance_2026_07"). A single-day read only ever touches one small
// sheet; a date-range read only touches the 1-2 months it spans. This keeps
// things fast permanently, regardless of how many months of history pile up --
// unlike reading one ever-growing sheet, whose base cost keeps rising forever.

function monthKeyOf_(dateStr) {
  return String(dateStr).slice(0, 4) + '_' + String(dateStr).slice(5, 7);
}

function monthKeysBetween_(start, end) {
  var keys = [];
  var d = new Date(start + 'T00:00:00');
  var endD = new Date(end + 'T00:00:00');
  while (d <= endD) {
    var key = d.getFullYear() + '_' + String(d.getMonth() + 1).padStart(2, '0');
    if (keys.indexOf(key) === -1) keys.push(key);
    d.setMonth(d.getMonth() + 1);
    d.setDate(1); // avoid day-of-month overflow skipping a month when incrementing
  }
  return keys;
}

function allMonthKeysFor_(prefix) {
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var keys = [];
  ss.getSheets().forEach(function (s) {
    var name = s.getName();
    if (name.indexOf(prefix + '_') === 0 && /^\\d{4}_\\d{2}$/.test(name.slice(prefix.length + 1))) {
      keys.push(name.slice(prefix.length + 1));
    }
  });
  return keys;
}

function readRawSheetRows_(sheetName, headers) {
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var sheet = ss.getSheetByName(sheetName);
  if (!sheet) return [];
  var values = sheet.getDataRange().getValues();
  if (values.length <= 1) return [];
  var dataRows = values.slice(1);
  var out = [];
  dataRows.forEach(function (row) {
    if (row[0] === '') return;
    var obj = {};
    headers.forEach(function (h, i) { obj[h] = h === 'date' ? normalizeDate_(row[i]) : row[i]; });
    out.push(obj);
  });
  return out;
}
