function readSheetAsObjects_(name) {
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var sheet = ss.getSheetByName(name);
  if (!sheet) return [];
  var values = sheet.getDataRange().getValues();
  if (values.length === 0) return [];
  var headers = values.shift();
  return values.filter(function (r) { return r[0] !== ''; }).map(function (row) {
    var obj = {};
    headers.forEach(function (h, i) { obj[String(h).trim()] = row[i]; });
    return obj;
  });
}

function readDateRows_(name, date, start, end) {
  var rows = readSheetAsObjects_(name);
  if (date) return rows.filter(function (r) { return String(r.date) === String(date); });
  if (start && end) return rows.filter(function (r) { return r.date >= start && r.date <= end; });
  return rows;
}

function writeStudents_(students) {
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var sheet = ss.getSheetByName('Students') || ss.insertSheet('Students');
  sheet.clear();
  sheet.appendRow(['id', 'name', 'className', 'rmt']);
  students.forEach(function (s) { sheet.appendRow([s.id, s.name, s.className, s.rmt]); });
}

function writeDateRecords_(sheetName, date, records) {
